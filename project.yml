name: MegaMicro
options:
  bundleIdPrefix: com.jessewaites
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: Jesse Waites (H25PD39UFF)"

targets:
  MegaMicroBridge:
    type: tool
    platform: macOS
    sources:
      - MegaMicroBridge
    settings:
      base:
        PRODUCT_NAME: MegaMicroBridge
        ENABLE_HARDENED_RUNTIME: YES

  MegaMicro:
    type: application
    platform: macOS
    sources:
      - MegaMicro
      - path: assets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jessewaites.megamicro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Jesse Waites"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "MegaMicro can activate and control apps like Conductor in response to your macro keyboard."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "MegaMicro listens to your FX-MIC so you can talk to your agents and trigger actions from the mic's buttons."
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: MegaMicro/MegaMicro.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MegaMicroBridge

  MegaMicroTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MegaMicroTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MegaMicro

  # iPhone companion: monitor the fleet and reassign keys over the LAN. Reuses
  # the shared Core + dashboard views; only the portable files are compiled in.
  MegaMicroiOS:
    type: application
    platform: iOS
    sources:
      - path: MegaMicro/Core
      - path: MegaMicro/Services/PrivateFileStore.swift
      - path: MegaMicro/Devices/Layouts/CodexMicroLayout.swift
      - path: MegaMicro/UI/KeyboardView.swift
      - path: MegaMicro/UI/KeyCapView.swift
      - path: MegaMicro/UI/KeyTooltip.swift
      - path: MegaMicro/UI/BrandIcon.swift
      - path: MegaMicroiOS
      - path: MegaMicroShared/BrandAssets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jessewaites.megamicro.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BE7XL423KU
        CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: MegaMicroiOS/Info.plist
      properties:
        CFBundleDisplayName: MegaMicro
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: "MegaMicro finds your Mac on your local network to mirror your agents and reassign keys."
        NSBonjourServices:
          - _megamicro._tcp
    dependencies:
      - target: MegaMicroWatch
        embed: true

  # Apple Watch monitor: the square board (swipe for the activity feed), fed by
  # the iPhone over WatchConnectivity. Reuses the same shared board views.
  MegaMicroWatch:
    type: application
    platform: watchOS
    sources:
      - path: MegaMicro/Core
      - path: MegaMicro/Services/PrivateFileStore.swift
      - path: MegaMicro/Devices/Layouts/CodexMicroLayout.swift
      - path: MegaMicro/UI/KeyboardView.swift
      - path: MegaMicro/UI/KeyCapView.swift
      - path: MegaMicro/UI/KeyTooltip.swift
      - path: MegaMicro/UI/BrandIcon.swift
      - path: MegaMicroWatch
      - path: MegaMicroShared/BrandAssets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jessewaites.megamicro.ios.watchkitapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BE7XL423KU
        CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: MegaMicroWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jessewaites.megamicro.ios
        CFBundleDisplayName: MegaMicro
    dependencies:
      - target: MegaMicroComplication
        embed: true

  # Watch-face complication ("MM"), tapping launches the watch app.
  MegaMicroComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: MegaMicroComplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jessewaites.megamicro.ios.watchkitapp.complication
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BE7XL423KU
        CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: MegaMicroComplication/Info.plist
      properties:
        CFBundleDisplayName: MegaMicro
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  MegaMicro:
    build:
      targets:
        MegaMicro: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MegaMicroTests
  MegaMicroiOS:
    build:
      targets:
        MegaMicroiOS: all
    run:
      config: Debug
  MegaMicroWatch:
    build:
      targets:
        MegaMicroWatch: all
    run:
      config: Debug
